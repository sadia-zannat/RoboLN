name: RoboLN Phase 01 verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Python requirements
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Python tests
        working-directory: backend
        run: python -m pytest -q
      - name: Alembic migration roundtrip
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Uvicorn real HTTP smoke
        working-directory: backend
        shell: bash
        run: |
          python -m uvicorn app.api:app --host 127.0.0.1 --port 8000 > uvicorn-ci.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          python ../scripts/smoke_http.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies with lockfile
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: ESLint strict gate
        working-directory: frontend
        run: npm run lint
      - name: TypeScript strict gate
        working-directory: frontend
        run: npm run typecheck
      - name: Next.js production build
        working-directory: frontend
        run: npm run build
  browser:
    runs-on: ubuntu-latest
    needs: [backend,frontend]
    if: always() && needs.backend.result == 'success' && needs.frontend.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser/server dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prepare test database schema
        working-directory: backend
        run: alembic upgrade head
      - name: Playwright Chromium responsive E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect actual browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roboln-browser-evidence
          path: |
            logs/browser-*.png
            logs/playwright-report
            frontend/test-results
          if-no-files-found: warn
